name: Build iOS App (.ipa)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-14

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
        xcodebuild -version

    - name: Copy web assets to iOS project
      run: |
        mkdir -p ios-app/CertiFiPro/www
        cp -R static/* ios-app/CertiFiPro/www/

    - name: Generate Xcode Project with Xcodegen
      run: |
        brew install xcodegen
        cd ios-app
        cat << 'EOF' > project.yml
        name: CertiFiPro
        options:
          bundleIdPrefix: com.certifi
          xcodeVersion: "15.4"
          format: xcode14
        targets:
          CertiFiPro:
            type: application
            platform: iOS
            deploymentTarget: "16.0"
            sources:
              - CertiFiPro
            settings:
              base:
                PRODUCT_BUNDLE_IDENTIFIER: com.certifi.pro
                INFOPLIST_FILE: CertiFiPro/Info.plist
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: "NO"
                CODE_SIGNING_ALLOWED: "NO"
                DEVELOPMENT_TEAM: ""
        EOF
        xcodegen generate

    - name: Build unsigned IPA
      run: |
        cd ios-app
        xcodebuild clean build \
          -project CertiFiPro.xcodeproj \
          -scheme CertiFiPro \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO

        mkdir -p build/Payload
        cp -R build/Release-iphoneos/CertiFiPro.app build/Payload/
        cd build
        zip -r ../../CertiFiPro.ipa Payload
        cd ../..

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CertiFiPro-iOS-IPA
        path: CertiFiPro.ipa

    - name: Add IPA to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.1.${{ github.run_number }}
        files: CertiFiPro.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
