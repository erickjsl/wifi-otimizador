plugins {
    id 'com.android.application'
}

// Número do build vindo do GitHub Actions (garante que cada APK novo é uma atualização válida)
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'com.certifi.pro'
    compileSdk 34

    defaultConfig {
        applicationId "com.certifi.pro"
        minSdk 24
        targetSdk 34
        versionCode 100 + buildNumber
        versionName "1.1." + buildNumber
    }

    // Chave FIXA: todo APK gerado é assinado igual, então instalar por cima de uma versão anterior funciona
    signingConfigs {
        fixed {
            storeFile file("certifi.p12")
            storePassword "certifipro"
            keyAlias "certifi"
            keyPassword "certifipro"
            storeType "pkcs12"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.fixed
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
}
